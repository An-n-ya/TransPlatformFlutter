name: Build ARMv8 APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build arm64-v8a APK (remote)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode Keystore
        # KEYSTORE_BASE64 是 android/app/my-ks.keystore 的 base64 内容。
        # 注意仓库结构：Android 模块在 android/app/ 下，Gradle 的 storeFile 相对路径
        # 以 android/app/ 为基准，所以必须解码到 android/app/my-ks.keystore。
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-ks.keystore

      - name: Verify Keystore
        run: |
          test -s android/app/my-ks.keystore \
            && echo "keystore OK ($(stat -c%s android/app/my-ks.keystore) bytes)" \
            || { echo "ERROR: android/app/my-ks.keystore is missing or empty"; exit 1; }

      - name: Write signing config
        # 与本地 android/key.properties 完全相同的读取路径，避免依赖 env 传递。
        # 任一 secret 为空时会带具体名称直接报错。
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          set -e
          : "${KEYSTORE_STORE_PASSWORD:?ERROR: secret KEYSTORE_STORE_PASSWORD is empty or not set}"
          : "${KEYSTORE_KEY_PASSWORD:?ERROR: secret KEYSTORE_KEY_PASSWORD is empty or not set}"
          : "${KEYSTORE_KEY_ALIAS:?ERROR: secret KEYSTORE_KEY_ALIAS is empty or not set}"
          printf 'storePassword=%s\n' "$KEYSTORE_STORE_PASSWORD" > android/key.properties
          printf 'keyPassword=%s\n' "$KEYSTORE_KEY_PASSWORD" >> android/key.properties
          printf 'keyAlias=%s\n' "$KEYSTORE_KEY_ALIAS" >> android/key.properties
          printf 'storeFile=my-ks.keystore\n' >> android/key.properties
          echo "key.properties written (alias=${#KEYSTORE_KEY_ALIAS} chars)"

      - name: Verify keystore credentials
        # 在签名前验证解码出的 keystore 与三个凭据是否真的匹配，
        # 避免在 :packageProdRelease 阶段报晦涩的 “final block not properly padded”。
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          set -e
          # 1) store password + alias 能否打开 keystore
          keytool -list -keystore android/app/my-ks.keystore \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            -alias "$KEYSTORE_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::store password or alias does NOT match the decoded keystore"; exit 1; }
          # 2) key password 能否解密私钥（keytool 不导出私钥，用 openssl 验证）
          if ! openssl pkcs12 -in android/app/my-ks.keystore \
                -passin pass:"$KEYSTORE_STORE_PASSWORD" -nodes 2>/dev/null \
                | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::key password (KEYSTORE_KEY_PASSWORD) does NOT match the decoded keystore's private key"
            exit 1
          fi
          echo "keystore credentials verified OK"

      - name: Build ARMv8 APK (prod flavor, release-signed)
        run: flutter build apk --release --flavor prod --dart-define=appFlavor=prod --target lib/main_remote.dart --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trans-platform-arm64-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error

      - name: Download pgyer_upload.sh
        run: |
          curl -sL -o pgyer_upload.sh \
            https://raw.githubusercontent.com/PGYER/upload-app-api-example/main/shell-demo/pgyer_upload.sh
          chmod +x pgyer_upload.sh

      - name: Upload APK to PGYER
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG="$(git log -1 --pretty=%B | head -n 1)"
          ./pgyer_upload.sh -j -d "GitHub Actions build ${SHORT_SHA}: ${COMMIT_MSG}" \
            build/app/outputs/flutter-apk/app-prod-release.apk
