name: Build ARMv8 APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build arm64-v8a APK (remote)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Fast dependency fetch WITHOUT a full build: resolve the agora_rtc_engine
      # plugin's own runtime classpath to force-download the external Agora AARs
      # into ~/.gradle (no compile, no manifest merge). The task exits nonzero on
      # an unrelated AGP project-variant ambiguity, which we ignore — the external
      # AAR files are already on disk by then.
      - name: Download Agora dependencies
        run: |
          cat > /tmp/resolve-agora.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.path == ':agora_rtc_engine') {
                      p.tasks.register('resolveAgoraDeps') {
                          doLast { p.configurations.releaseRuntimeClasspath.resolve() }
                      }
                  }
              }
          }
          EOF
          (cd android && ./gradlew --no-daemon -I /tmp/resolve-agora.gradle :agora_rtc_engine:resolveAgoraDeps) || true

      - name: Patch Agora AAR manifests
        run: ./fix_agora_aar.sh

      # fix_agora_aar.sh deletes the Gradle transform cache, which leaves stale
      # file-access journals/hash records pointing at the deleted outputs. They
      # must be cleared (plus any lingering daemon stopped) or the next build
      # fails with NoSuchFileException. All of these are safe caches.
      - name: Reset Gradle daemon state
        run: |
          (cd android && ./gradlew --stop 2>/dev/null) || true
          # [G] avoids pkill matching this shell's own command line
          pkill -f '[G]radleDaemon' 2>/dev/null || true
          rm -rf \
            ~/.gradle/caches/journal-1 \
            ~/.gradle/caches/fileHashes \
            ~/.gradle/caches/fileContent

      - name: Verify Agora AAR patch
        run: |
          aar_count=$(find ~/.gradle/caches/modules-2/files-2.1/io.agora.rtc/iris-rtc \
            -name 'iris-rtc-*.aar' 2>/dev/null | wc -l)
          test "$aar_count" -gt 0 || { echo "iris-rtc AAR not found — dependency fetch failed"; exit 1; }
          patched=0
          while IFS= read -r aar; do
            tmp="$(mktemp -d)"
            unzip -oq "$aar" AndroidManifest.xml -d "$tmp"
            if grep -q 'package="io.agora.iris"' "$tmp/AndroidManifest.xml"; then
              echo "OK patched: $(basename "$aar")"; patched=1
            else
              echo "UNPATCHED: $(basename "$aar")"; exit 1
            fi
          done < <(find ~/.gradle/caches/modules-2/files-2.1/io.agora.rtc/iris-rtc -name 'iris-rtc-*.aar')
          test "$patched" -eq 1 && echo "Agora patch verified"

      - name: Build ARMv8 APK (prod flavor)
        run: flutter build apk --release --flavor prod --dart-define=appFlavor=prod --target lib/main_remote.dart --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trans-platform-arm64-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error

      - name: Download pgyer_upload.sh
        run: |
          curl -sL -o pgyer_upload.sh \
            https://raw.githubusercontent.com/PGYER/upload-app-api-example/main/shell-demo/pgyer_upload.sh
          chmod +x pgyer_upload.sh

      - name: Upload APK to PGYER
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG="$(git log -1 --pretty=%B | head -n 1)"
          ./pgyer_upload.sh -j -d "GitHub Actions build ${SHORT_SHA}: ${COMMIT_MSG}" \
            build/app/outputs/flutter-apk/app-prod-release.apk
